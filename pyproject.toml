[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passorch"
version = "0.1.0"
description = "PassOrch - capability-aware password-auditing orchestration platform (discovery, verified capability parsing, capability-aware selection and simulation only)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "allow_subprocess: permits the single authorised Node.js test runner",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["frontend"]

[tool.ruff.lint]
select = ["F", "E9"]

# Incremental typing gate (Step 5): the API surface and the engine layer
# must type-check under mypy with per-function body checking.  Run as
# ``python -m mypy app/api app/engines`` (CI runs exactly that).
[tool.mypy]
files = ["app/api", "app/engines"]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

# Narrow, justified exception: the discovery service intentionally accepts
# untrusted engine names as ``object`` and verifies them with isinstance
# checks at runtime before use (``_resolve_subset``).  The module is on the
# protected-files list, so the one resulting ``arg-type`` finding is
# disabled module-wide rather than edited; no other error codes are
# relaxed here.
[[tool.mypy.overrides]]
module = "app.engines.discovery.service"
disable_error_code = ["arg-type"]
