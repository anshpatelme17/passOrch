# CI for PassOrch - simulation-only audit-planning platform.
#
# Runs the exact checks documented in README "Testing":
#   * Python test suite (temporary directories and in-memory stores; no
#     real token, database, engine, or external service required)
#   * Ruff (F/E9, line length 100 - see pyproject.toml)
#   * mypy (app/api + app/engines; see pyproject.toml [tool.mypy])
#   * git diff --check (whitespace)
# * Frontend harness via its verified pytest invocation (the harness is
#     a pytest module - running it as a plain script cannot import the
#     ``tests`` package)
#
# Supply-chain integrity (Step 11F / Phase 12):
#   * Actions are pinned to full commit SHAs (annotated with the major
#     release they track), resolved from the GitHub API - tags are
#     mutable, SHAs are not.
#   * Python dependencies install from requirements.lock with
#     --require-hashes; every artifact hash was taken from the PyPI
#     JSON API for the verified closure.  pyproject.toml keeps the
#     compatible ranges; constraints.txt remains the human-readable
#     range-pin reference.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install hash-verified dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install project (no dependency re-resolution)
        run: python -m pip install --no-deps -e .

      - name: Dependency lock consistency
        run: python scripts/check_dependency_lock.py

      - name: Python test suite
        run: python -m pytest --tb=short

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy app/api app/engines

      - name: Whitespace check
        run: git diff --check

      - name: Frontend harness
        run: python -m pytest tests/test_frontend_js_execution.py
