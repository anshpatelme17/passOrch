# CI for PassOrch - simulation-only audit-planning platform.
#
# Runs the exact checks documented in README "Testing":
#   * Python test suite (temporary directories and in-memory stores; no
#     real token, database, engine, or external service required)
#   * Ruff (F/E9, line length 100 - see pyproject.toml)
#   * mypy (app/api + app/engines; see pyproject.toml [tool.mypy])
#   * git diff --check over the full committed tree (whitespace)
#   * Frontend harness via its verified pytest invocation (the harness is
#     a pytest module - running it as a plain script cannot import the
#     ``tests`` package)
#   * Docker image build + container smoke test (the production image
#     must build from the runtime lock, start, and answer readiness in
#     simulated mode)
#
# Supply-chain integrity (Step 11F / Phase 12):
#   * Actions are pinned to full commit SHAs (annotated with the major
#     release they track), resolved from the GitHub API - tags are
#     mutable, SHAs are not.
#   * Python dependencies install from requirements.lock with
#     --require-hashes; every artifact hash was taken from the PyPI
#     JSON API for the verified closure.  pyproject.toml keeps the
#     compatible ranges; constraints.txt remains the human-readable
#     range-pin reference.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install hash-verified dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install project (no dependency re-resolution)
        run: python -m pip install --no-deps -e .

      - name: Dependency lock consistency
        run: python scripts/check_dependency_lock.py

      - name: Python test suite
        run: python -m pytest --tb=short

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy app/api app/engines

      - name: Whitespace check
        # Check the committed tree, not the checkout: with no range,
        # `git diff --check` diffs worktree vs index and can never fail on a
        # clean checkout.  An empty tree -> HEAD range treats every committed
        # line as an addition, so trailing whitespace or space-before-tab
        # anywhere in the repository fails the gate.
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Frontend harness
        run: python -m pytest tests/test_frontend_js_execution.py

  test-windows:
    # Windows coverage for Python, filesystem, path and SQLite behaviour
    # (rollback-journal locking, temp-dir handling) that ubuntu-latest
    # cannot catch.  Simulation-only: same hash-verified lock install,
    # same suite; the frontend code is exercised inside the full pytest
    # run (Node is preinstalled on the Windows runner and discovered via
    # PATH), and the whitespace check stays an ubuntu-latest gate.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install hash-verified dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install project (no dependency re-resolution)
        run: python -m pip install --no-deps -e .

      - name: Dependency lock consistency
        run: python scripts/check_dependency_lock.py

      - name: Python test suite
        run: python -m pytest --tb=short

      - name: Ruff
        run: python -m ruff check .

      - name: mypy
        run: python -m mypy app/api app/engines

  docker:
    # The production image must actually build and run: the runtime-only
    # hash-verified lock installs, the hardened container starts non-root,
    # and readiness answers in simulated mode.  This catches Dockerfile /
    # lock drift that the static artifact tests cannot.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag passorch:ci .

      - name: Run container and smoke-test readiness
        run: |
          docker run -d --name passorch-smoke -p 127.0.0.1:8123:8000 passorch:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8123/health/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8123/health/ready
          curl -fsS http://127.0.0.1:8123/health | grep -q '"mode":"simulated"'
          docker logs passorch-smoke

      - name: Remove container
        if: always()
        run: docker rm -f passorch-smoke || true
